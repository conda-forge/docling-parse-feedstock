context:
  version: "7.24.1"
  common_deselect:
    - "--deselect tests/test_unit_damaged_pages.py::test_lost_resources_object_is_reported"
  # no clue why it fails on our CI images, it passes on Gentoo,
  # so probably something leaks from the host system
  linux_deselect:
    - "--deselect=tests/test_unit_text_render_modes.py::test_stroking_render_mode_is_heavier_than_fill"

package:
  name: docling-parse
  version: ${{ version }}

source:
  url: https://github.com/DS4SD/docling-parse/archive/refs/tags/v${{ version }}.zip
  sha256: 2cb128f9220e733b1c82f9bed66cde686d557f5fba779f0934eddc9570d85142
  patches:
    - fix-utfcpp.patch

build:
  number: 0
  skip: win
  script:
    env:
      USE_SYSTEM_DEPS: on
    content:
      - export BUILD_THREADS=${CPU_COUNT}
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - pybind11 >=2.13.1

    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - cmake >=3.27.0,<4.0.0
    - if: unix
      then: make
      else: ninja
    - pkg-config
  host:
    # build tools
    - python
    - setuptools >=77.0.3
    - pybind11 >=2.13.6
    - pip
    # libraries
    - cxxopts
    - loguru-cpp
    - nlohmann_json
    - utfcpp
    - libjpeg-turbo
    - openjpeg
    - lcms2
    - qpdf
    - zlib
    - blend2d
    - freetype
  run:
    - python
    - tabulate >=0.9.0,<1.0.0
    - if: win
      then: pywin32 >=305
    - pillow >=10.0.0,<14.0.0
    - pydantic >=2.0.0
    - docling-core >=2.99.0,<3.0.0
    - blend2d
tests:
  - python:
      imports:
        - docling_parse
      pip_check: true
  - requirements:
      run:
        - pytest
        - huggingface_hub
    files:
      source:
        - tests/
    script:
      # run only unittests, otherwise we would need to download a huge
      # corpus
      - if: linux
        then: pytest -vv tests/test_unit*.py ${{ common_deselect|join(' ') }} ${{ linux_deselect|join(' ') }}
        else: pytest -vv tests/test_unit*.py ${{ common_deselect|join(' ') }}

about:
  summary: Simple package to extract text with coordinates from programmatic PDFs
  license: BSD-3-Clause AND MIT
  license_file:
    - LICENSE
    - docling_parse/pdf_resources/cmap-resources/LICENSE.md
  homepage: https://github.com/docling-project/docling-parse

extra:
  recipe-maintainers:
    - kklein
    - mgorny
